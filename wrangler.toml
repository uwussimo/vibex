# Cloudflare: the landing page at vibex.cc, a Worker that serves docs/ as static assets.
# Connect this repo in the Cloudflare dashboard (Workers & Pages → Create → Import a repository);
# the default deploy command, `npx wrangler deploy`, reads this file. There is no build step.
name = "vibex"
compatibility_date = "2026-10-01"

[assets]
directory = "./docs"
