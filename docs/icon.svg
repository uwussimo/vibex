<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Vibex icon: stacked terminal, browser and device windows">
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fb7a"/>
      <stop offset="1" stop-color="#2fbf71"/>
    </linearGradient>
    <linearGradient id="sTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#2459e0"/>
    </linearGradient>
    <linearGradient id="sWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
    <linearGradient id="sDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#121214" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="sRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="sLayer" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b3d1f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sBg)" filter="url(#sShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sTop)"/>
  <!-- back: device -->
  <rect x="372" y="212" width="440" height="380" rx="72" fill="url(#sBlue)" filter="url(#sLayer)"/>
  <!-- middle: browser -->
  <rect x="302" y="302" width="440" height="380" rx="72" fill="url(#sWhite)" filter="url(#sLayer)"/>
  <circle cx="362" cy="352" r="13" fill="#ff5f57"/>
  <circle cx="400" cy="352" r="13" fill="#febc2e"/>
  <circle cx="438" cy="352" r="13" fill="#28c840"/>
  <!-- front: terminal glass -->
  <rect x="212" y="412" width="460" height="400" rx="76" fill="url(#sDark)" filter="url(#sLayer)"/>
  <rect x="214" y="414" width="456" height="396" rx="74" fill="none" stroke="url(#sRim)" stroke-width="4"/>
  <path d="M312 548 L410 612 L312 676" fill="none" stroke="#b4f04c" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="452" y="652" width="118" height="46" rx="14" fill="#b4f04c"/>
</svg>
